[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raymand"
version = "0.1.0"
description = "DataMind — conversational BI platform"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    # Target-database drivers. All ship wheels and need no system client:
    # oracledb runs in thin mode, so no Oracle Instant Client; pymssql
    # bundles FreeTDS, which keeps the ODBC stack out of the image.
    "aiomysql>=0.2",
    "oracledb>=2.4",
    "pymssql>=2.3",
    "sqlglot>=25.0",
    "litellm>=1.52",
    # The run orchestrator. Confined to `app/pipeline/` and `app/workers/` by
    # the contract below and by a CI grep, exactly as litellm is confined to
    # `app/infra/llm/` — it pulls in the LangChain core object model, and a
    # heavy dependency on the request path is only acceptable behind a boundary
    # something enforces. The checkpointer is deliberately absent: it needs
    # psycopg 3 alongside asyncpg and arrives with that decision in Phase 4
    # (docs/langgraph-migration.md).
    "langgraph>=1.2,<2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    # Eval harness spins real fixture databases in throwaway containers.
    "testcontainers>=4.8",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "fixtures*"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "ASYNC", "S"]
ignore = ["S101", "B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# Alembic revisions are generated; their column definitions run long.
"app/infra/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── The dependency rule, enforced rather than documented ─────────────────
[tool.importlinter]
root_package = "app"
# Required by import-linter when a forbidden contract names external packages
# (fastapi, sqlalchemy, litellm) so they appear in the import graph.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> domain <- infra"
type = "layers"
layers = ["app.api", "app.services", "app.pipeline", "app.reports", "app.semantic", "app.knowledge", "app.domain"]
# Services may reach into infra (adapters). infra is not a layer here, so this
# is unconstrained anyway; keep the note but do not error if it matches nothing.
ignore_imports = ["app.services.* -> app.infra.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "domain imports no frameworks and no infrastructure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "litellm", "app.infra", "app.api", "app.services"]

[[tool.importlinter.contracts]]
name = "sqlguard is self-contained"
type = "forbidden"
source_modules = ["app.sqlguard"]
forbidden_modules = ["fastapi", "sqlalchemy", "litellm", "app.infra", "app.api"]

[[tool.importlinter.contracts]]
# Same rule as sqlguard, for the same reason: the semantic layer is a pure
# function of a schema snapshot, a document, and an LLM *port* — so it can be
# driven end to end in a test with a dict and a fake gateway.
name = "semantic is self-contained"
type = "forbidden"
source_modules = ["app.semantic"]
forbidden_modules = ["fastapi", "sqlalchemy", "litellm", "app.infra", "app.api", "app.services"]

[[tool.importlinter.contracts]]
# The third package to take this contract, and the reason is the same one
# twice over: `app.knowledge` parses SQL, normalises strings and walks a
# snapshot dict, so it can be driven end to end against literals — and a
# package with no idea what a session is cannot grow a query that skips the
# guard. `app.sqlguard` is deliberately absent from the forbidden list:
# validating a template *is* calling the guard, and the whole point of the
# fifth entry point is that it reuses the same `guard()` the other four do.
name = "knowledge is self-contained"
type = "forbidden"
source_modules = ["app.knowledge"]
forbidden_modules = ["fastapi", "sqlalchemy", "litellm", "app.infra", "app.api", "app.services"]

[[tool.importlinter.contracts]]
# Copied from the semantic one, for the reason it gives: the outline validator,
# the narration prompt builder and the numeric check are pure functions of a
# string, a dict and an LLM *port*, so each runs in a test with no database and
# no HTTP client anywhere near it.
name = "reports is self-contained"
type = "forbidden"
source_modules = ["app.reports"]
forbidden_modules = ["fastapi", "sqlalchemy", "litellm", "app.infra", "app.api", "app.services"]

[[tool.importlinter.contracts]]
# The same bargain the LiteLLM grep makes, for the same reason: LangGraph is
# only affordable on the request path if it stays behind a boundary, and a
# boundary nothing checks is a comment. The orchestration layer is
# `app/pipeline/` (the chat graph and the shared repair subgraph) and
# `app/workers/` (the report graph); `app.reports` is a *source* here on
# purpose — that package is self-contained by contract and sits below the
# pipeline, so the report graph goes in `app/workers/`, never in it.
name = "langgraph stays in the orchestration layer"
type = "forbidden"
source_modules = ["app.domain", "app.sqlguard", "app.semantic", "app.reports",
                  "app.charts", "app.api"]
forbidden_modules = ["langgraph", "langchain_core"]
# Direct imports only, and this is not optional. A forbidden contract reports
# indirect chains by default, and `app.api -> app.services ->
# app.pipeline.graph -> langgraph` is a real chain — one that is not a
# violation, because the rule being enforced is that these packages do not
# *know* about langgraph, which is the same rule the CI grep enforces. Without
# this the contract goes red for a reason that has nothing to do with layering,
# and the next person deletes the contract instead of the import.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "eval is offline-only (never on the request path)"
type = "forbidden"
source_modules = ["app.api", "app.services", "app.pipeline", "app.domain", "app.sqlguard", "app.infra"]
forbidden_modules = ["app.eval"]
