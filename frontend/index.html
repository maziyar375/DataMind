<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>DataMind</title>
    <!--
      No Google Fonts. All three families are self-hosted from /fonts and
      declared in styles.css, because this app is routinely deployed behind a
      firewall that cannot reach fonts.gstatic.com — and a render-blocking
      stylesheet on an unreachable host delays first paint by the whole
      connection timeout before it fails.

      Preloaded here are only the two faces every first paint needs: the Latin
      subsets of the UI face and the mono face. Vazirmatn is deliberately not
      preloaded — its `unicode-range` is what keeps the Arabic subset off the
      critical path for an English session, and preloading would spend that
      saving on every user to help some. A Persian document that needs the file
      resident before it is measured asks for it explicitly instead; see
      `report-print.ts`, which loads it prior to printing.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
