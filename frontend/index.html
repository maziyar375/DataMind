<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>DataMind</title>
    <!--
      Vazirmatn is deliberately absent from this list: it is self-hosted from
      /fonts in styles.css. A printed Persian report is the product's
      deliverable, and a deployment behind a firewall must not render it in a
      fallback face. Inter and JetBrains Mono degrade to system-ui and
      ui-monospace, which is a cosmetic difference in the app, not a wrong
      document leaving it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
