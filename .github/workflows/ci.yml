name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app || true   # strict mode is being adopted module by module

      # Milestone item 11 — the dependency rule is enforced, not documented.
      - name: Architecture contracts
        run: lint-imports

      # The authorization gate — docs/user-management-and-access-control-plan.md
      # §18.4. Four greps, each naming a way of deciding access that this
      # codebase has agreed not to use.
      #
      # **Non-blocking on purpose, and only until Phase 2.** It fails today on
      # the ~40 lines that still decide ownership inside a service, and those
      # lines are removed in Phases 1 and 2 — at which point `continue-on-error`
      # comes off and this becomes a real gate. Landing it red now is what makes
      # the count visible in every PR while it goes down.
      - name: Authorization decisions live in the authorizer
        working-directory: .
        continue-on-error: true
        run: make authz-check

      # Milestone item 12 — one grep decides whether the LLM abstraction is
      # real or decorative. It costs a single CI line.
      - name: LiteLLM stays behind the gateway
        run: |
          if grep -rn "import litellm" app/ | grep -v "infra/llm/"; then
            echo "::error::litellm imported outside infra/llm/"
            exit 1
          fi

      # The same grep, for the same bargain: LangGraph is affordable on the
      # request path only while it stays behind the orchestration boundary.
      # `app/pipeline/` holds the chat graph and the shared repair subgraph;
      # `app/workers/` holds the report graph. Nothing else may know it exists.
      # See docs/langgraph-migration.md.
      - name: LangGraph stays in the orchestration layer
        run: |
          if grep -rnE "^\s*(import|from)\s+(langgraph|langchain_core)\b" app/ \
             | grep -vE "^app/(pipeline|workers)/"; then
            echo "::error::langgraph imported outside app/pipeline/ and app/workers/"
            exit 1
          fi

      # Milestone item 6 — the hard gate.
      - name: Hostile SQL corpus
        run: pytest tests/unit/test_sqlguard_hostile.py -q

      - name: Tests
        run: pytest -q
        env:
          JWT_SECRET: ci-secret
          ENVIRONMENT: ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build
