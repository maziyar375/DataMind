# Round-robin over the API replicas, for the Phase 6 two-replica rig.
#
# The buffering settings are not tuning — they are what makes SSE work through
# a proxy at all. nginx buffers a response by default, which for a stream means
# it holds the tokens until the buffer fills or the run ends, and the live step
# trail arrives all at once at the end. That is also why the app sets
# `X-Accel-Buffering: no` on the stream response; this is the same instruction
# from the other side, for the events endpoint and everything else.

upstream api_replicas {
    # Docker's embedded DNS returns every replica's address for this name, and
    # nginx round-robins across them. Re-resolved on reload rather than at
    # startup only, so a `compose up --scale` is picked up.
    server api:8000;
}

server {
    listen 8000;
    server_name _;

    # A report generation is minutes long and a chat SSE stream stays open for
    # the life of the run; the default 60s read timeout would cut both.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    location / {
        proxy_pass http://api_replicas;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE is a long-lived HTTP response, not a websocket, but the same
        # connection handling applies: no keep-alive reuse mid-stream.
        proxy_set_header Connection "";

        # The three that matter for streaming. Without them a browser sees
        # nothing until the run finishes, and the "live step trail" the SPA is
        # built around silently becomes a summary.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
}
