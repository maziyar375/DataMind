services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raymand
      POSTGRES_PASSWORD: raymand
      POSTGRES_DB: raymand
    ports: ["5432:5432"]
    # Bind-mount onto the project dir (the persistent Lightning Studio drive)
    # instead of a Docker-managed named volume. Named volumes live under
    # /var/lib/docker, which is ephemeral here: a Studio stop wipes it and with
    # it every chat and connection. A path inside the studio drive survives.
    # The entrypoint shim recreates the empty runtime dirs Postgres needs but
    # that the studio drive drops across restarts (it does not preserve empty
    # directories), which would otherwise make the server fail to start with
    # "could not open directory 'pg_notify'". Data itself is untouched.
    volumes:
      - ./.data/db:/var/lib/postgresql/data
      - ./scripts/pg-ensure-runtime-dirs.sh:/usr/local/bin/pg-ensure-runtime-dirs.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-ensure-runtime-dirs.sh"]
    # Overriding entrypoint clears the image's default CMD, so restore it: the
    # shim passes these args through to docker-entrypoint.sh.
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raymand"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The demo target database. A separate instance, because the whole point is
  # that DataMind reaches customer data over a connector with a read-only role.
  sales:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales
    ports: ["5433:5432"]
    volumes:
      - ./backend/fixtures/sales_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      # The catalog descriptions, as a second init script rather than part of
      # the seed: the eval needs a commented and an uncommented arm of the same
      # fixture (docs/catalog-metadata-plan.md §7 Phase 6), and the demo is the
      # commented one — a developer should see the schema browser and the run
      # prompt carrying a DBA's sentences, which is the whole feature.
      - ./backend/fixtures/sales_comments.sql:/docker-entrypoint-initdb.d/02_comments.sql:ro
      - raymand_sales:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A second demo target — the classic MySQL "Sakila" sample database: 16
  # tables (films, actors, rentals, payments, customers, stores) with real
  # data, so the app can be driven against MySQL as well as PostgreSQL. The
  # seed also creates the read-only `analytics_ro` user the connector expects.
  sakila:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sakila
    ports: ["3307:3306"]
    volumes:
      - ./backend/fixtures/mysql:/docker-entrypoint-initdb.d:ro
      - raymand_sakila:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The DEMO target database. `sales` is the eval fixture — 42 tables that are
  # messy on purpose — which makes it the wrong thing to drive a demo against.
  # `aurora` is the opposite artifact: 12 clean tables whose cardinalities are
  # tuned to the chart budgets in app/charts/__init__.py, so the obvious
  # question produces the chart you wanted. See backend/fixtures/demo_seed.sql.
  aurora:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aurora
    ports: ["5434:5432"]
    volumes:
      - ./backend/fixtures/demo_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      # Catalog descriptions as a second init script, matching the `sales`
      # layout. Here they are not an A/B arm but a straight accuracy win: the
      # run prompt carries them into SQL generation.
      - ./backend/fixtures/demo_comments.sql:/docker-entrypoint-initdb.d/02_comments.sql:ro
      - raymand_aurora:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurora"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Oracle and SQL Server demo targets used to live here, behind a `targets`
  # profile. They were removed: ~2 GB of RAM each for services most sessions
  # never started. The *connectors* are untouched and all four engines remain
  # supported — what is gone is the local demo server, not the support. Their
  # seeds are still in backend/fixtures/ (oracle/ and sales_seed_mssql.sql), so
  # `git revert` of this change, or a plain `docker run`, brings them back.

  api:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
      sales: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+asyncpg://raymand:raymand@db:5432/raymand
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:?Generate one - see README}
      JWT_SECRET: ${JWT_SECRET:?Generate one - see README}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@raymand.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-raymand}
      CORS_ORIGINS: '["http://localhost:5173"]'
      ENVIRONMENT: local
      DEBUG: "true"
      # Headroom for slow hosted models. A chat run makes several sequential
      # LLM calls (route, generate, answer, chart intent); against a flash
      # model over OpenRouter the whole run lands at 45-140s, which overruns
      # the 120s default and fails questions that were about to succeed.
      RUN_DEADLINE_SECONDS: "${RUN_DEADLINE_SECONDS:-300}"
      LLM_REQUEST_TIMEOUT_SECONDS: "${LLM_REQUEST_TIMEOUT_SECONDS:-120}"
    ports: ["8000:8000"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]

  web:
    build: ./frontend
    depends_on: [api]
    environment:
      # A same-origin path, not an absolute URL. In a remote environment the
      # browser is not on the same machine as the API, so "localhost:8000"
      # would resolve to the user's own laptop. Vite proxies /api server-side,
      # where the compose network name "api" is reachable.
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://api:8000
      # Set VITE_POLL=1 if hot reload does not fire on your host's bind mounts.
      VITE_POLL: "${VITE_POLL:-0}"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  # raymand_db is now a bind mount onto the studio drive (see the db service),
  # so it is no longer a named volume. sales and sakila stay ephemeral on
  # purpose: they re-seed from their init scripts on every fresh start.
  raymand_sales:
  raymand_sakila:
  raymand_aurora:
