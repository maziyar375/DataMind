services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raymand
      POSTGRES_PASSWORD: raymand
      POSTGRES_DB: raymand
    ports: ["5432:5432"]
    # Bind-mount onto the project dir (the persistent Lightning Studio drive)
    # instead of a Docker-managed named volume. Named volumes live under
    # /var/lib/docker, which is ephemeral here: a Studio stop wipes it and with
    # it every chat and connection. A path inside the studio drive survives.
    # The entrypoint shim recreates the empty runtime dirs Postgres needs but
    # that the studio drive drops across restarts (it does not preserve empty
    # directories), which would otherwise make the server fail to start with
    # "could not open directory 'pg_notify'". Data itself is untouched.
    volumes:
      - ./.data/db:/var/lib/postgresql/data
      - ./scripts/pg-ensure-runtime-dirs.sh:/usr/local/bin/pg-ensure-runtime-dirs.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-ensure-runtime-dirs.sh"]
    # Overriding entrypoint clears the image's default CMD, so restore it: the
    # shim passes these args through to docker-entrypoint.sh.
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raymand"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The demo target database. A separate instance, because the whole point is
  # that DataMind reaches customer data over a connector with a read-only role.
  sales:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales
    ports: ["5433:5432"]
    volumes:
      - ./backend/fixtures/sales_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      # The catalog descriptions, as a second init script rather than part of
      # the seed: the eval needs a commented and an uncommented arm of the same
      # fixture (docs/catalog-metadata-plan.md §7 Phase 6), and the demo is the
      # commented one — a developer should see the schema browser and the run
      # prompt carrying a DBA's sentences, which is the whole feature.
      - ./backend/fixtures/sales_comments.sql:/docker-entrypoint-initdb.d/02_comments.sql:ro
      - raymand_sales:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A second demo target — the classic MySQL "Sakila" sample database: 16
  # tables (films, actors, rentals, payments, customers, stores) with real
  # data, so the app can be driven against MySQL as well as PostgreSQL. The
  # seed also creates the read-only `analytics_ro` user the connector expects.
  sakila:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sakila
    ports: ["3307:3306"]
    volumes:
      - ./backend/fixtures/mysql:/docker-entrypoint-initdb.d:ro
      - raymand_sakila:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── The other two engines, behind profiles ──────────────────────────────
  # Postgres and MySQL start with the stack because they are small and are what
  # the demo and the eval use. Oracle and SQL Server are ~2 GB of RAM each and
  # most sessions never touch them, so they are opt-in:
  #
  #   docker compose --profile targets up -d      # both, alongside the stack
  #   docker compose up -d oracle                 # just one; naming a service
  #                                               # enables its profile
  #
  # Neither is wired into `api`'s depends_on for the same reason: the app must
  # start without them.

  # The only Oracle target in this repository. Its schema is small and its
  # comments are the point — see backend/fixtures/oracle/. 18c XE is the release
  # the catalog-comment feature was verified on and the newest Oracle that pulls
  # without an Oracle account (docs/catalog-metadata-plan.md §9); the connector
  # itself is version-agnostic.
  #
  # No volume, deliberately, exactly like sales and sakila: a fresh container
  # re-runs the init scripts, and the image ships a prebuilt database so that
  # costs ~40 s rather than the many minutes a from-scratch CREATE DATABASE onto
  # an empty volume would.
  oracle:
    image: gvenzl/oracle-xe:18
    profiles: ["oracle", "targets"]
    environment:
      ORACLE_PASSWORD: oracle          # SYS and SYSTEM
      APP_USER: sales                  # owns the demo schema
      APP_USER_PASSWORD: sales
    ports: ["1521:1521"]
    volumes:
      - ./backend/fixtures/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      # Ships with the image, and checks the PDB rather than the instance —
      # XEPDB1 is what a connection's `database_name` (a *service* name on
      # Oracle) actually points at.
      test: ["CMD", "healthcheck.sh", "XEPDB1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # SQL Server, loaded with the 42-table `sales` mirror the eval and
  # `make fixtures` already use — so this one *is* comparable to the Postgres
  # demo, unlike the Oracle schema above.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql", "targets"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Str0ng_Passw0rd!}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    healthcheck:
      # The tools path moved between image generations, so probe both — the same
      # thing backend/fixtures/rebuild_fixtures.sh does.
      test: ["CMD-SHELL", "for b in /opt/mssql-tools18/bin /opt/mssql-tools/bin; do [ -x $$b/sqlcmd ] && exec $$b/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1'; done; exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # SQL Server has no `docker-entrypoint-initdb.d`, so the seed is a one-shot
  # sidecar rather than a mount. It reuses the server image because sqlcmd is
  # already in it — no second image to pull — runs once and exits, and **skips
  # if `sales` already exists**: the seed drops and recreates the database, so
  # running it on every `up` would quietly destroy whatever you had. Delete the
  # container's database (or the container) to force a reseed.
  mssql-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql", "targets"]
    depends_on:
      mssql: {condition: service_healthy}
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Str0ng_Passw0rd!}
    volumes:
      - ./backend/fixtures/sales_seed_mssql.sql:/seed.sql:ro
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for b in /opt/mssql-tools18/bin /opt/mssql-tools/bin; do
          [ -x "$$b/sqlcmd" ] && SQLCMD="$$b/sqlcmd"
        done
        : "$${SQLCMD:?sqlcmd not found in the mssql image}"
        state=$$("$$SQLCMD" -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -N -h -1 -W \
          -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID('sales') IS NULL THEN 'SEED' ELSE 'SKIP' END" | tr -d '\r')
        case "$$state" in
          *SEED*) echo "seeding sales (42 tables)…"
                  "$$SQLCMD" -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -N -b -i /seed.sql
                  echo "sales seeded; read-only login analytics_ro is ready" ;;
          *)      echo "sales already exists - leaving it alone" ;;
        esac

  api:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
      sales: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+asyncpg://raymand:raymand@db:5432/raymand
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:?Generate one - see README}
      JWT_SECRET: ${JWT_SECRET:?Generate one - see README}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@raymand.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-raymand}
      CORS_ORIGINS: '["http://localhost:5173"]'
      ENVIRONMENT: local
      DEBUG: "true"
    ports: ["8000:8000"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]

  web:
    build: ./frontend
    depends_on: [api]
    environment:
      # A same-origin path, not an absolute URL. In a remote environment the
      # browser is not on the same machine as the API, so "localhost:8000"
      # would resolve to the user's own laptop. Vite proxies /api server-side,
      # where the compose network name "api" is reachable.
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://api:8000
      # Set VITE_POLL=1 if hot reload does not fire on your host's bind mounts.
      VITE_POLL: "${VITE_POLL:-0}"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  # raymand_db is now a bind mount onto the studio drive (see the db service),
  # so it is no longer a named volume. sales and sakila stay ephemeral on
  # purpose: they re-seed from their init scripts on every fresh start.
  raymand_sales:
  raymand_sakila:
